name: Build & Publish OmarVio Android Native APK

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional tag name if triggering a manual release build (e.g. v2.0.1)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release Native Chromium Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Resolve Release Version Metadata
        id: release_meta
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_NAME="${{ github.ref_name }}"
            IS_TAG="true"
            VERSION_NAME="${TAG_NAME#v}"
          elif [ -n "${{ github.event.inputs.release_tag }}" ]; then
            TAG_NAME="${{ github.event.inputs.release_tag }}"
            IS_TAG="true"
            VERSION_NAME="${TAG_NAME#v}"
          else
            TAG_NAME="v2.0.0-build.${{ github.run_number }}"
            IS_TAG="false"
            VERSION_NAME="2.0.0.${{ github.run_number }}"
          fi
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "is_tag_release=${IS_TAG}" >> "$GITHUB_OUTPUT"

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK 35 & Build Tools
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK_DIR" ]; then
            echo "Android SDK directory not found at $SDK_DIR"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          SDKMANAGER=$(find "$SDK_DIR/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1)
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER=$(command -v sdkmanager || true)
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found inside $SDK_DIR"
            exit 1
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_DIR" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_DIR" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Android Release APK
        working-directory: android
        run: |
          gradle assembleRelease --no-daemon --stacktrace \
            -PversionName="${{ steps.release_meta.outputs.version_name }}" \
            -PversionCode="${{ steps.release_meta.outputs.version_code }}"

      - name: Prepare & Verify Signed APK Binary
        run: |
          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "Release APK not found at $APK_PATH"
            ls -la android/app/build/outputs/apk/release/ || true
            exit 1
          fi
          cp "$APK_PATH" omarvio-browser.apk
          SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          APKSIGNER=$(find "$SDK_DIR/build-tools" -name apksigner -type f | head -n 1)
          if [ -z "$APKSIGNER" ]; then
            echo "apksigner not found in $SDK_DIR/build-tools"
            exit 1
          fi
          "$APKSIGNER" verify --verbose omarvio-browser.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: omarvio-browser-release-apk-${{ steps.release_meta.outputs.version_name }}
          path: omarvio-browser.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish Public GitHub Release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag_name }}
          name: OMARVIO Browser Native Android APK (${{ steps.release_meta.outputs.version_name }})
          generate_release_notes: true
          make_latest: true
          body: |
            ### ওমারভিও নেটিভ অ্যান্ড্রয়েড ব্রাউজার (${{ steps.release_meta.outputs.version_name }})
            - সরাসরি ডাউনলোড ও ফোন ইনস্টলযোগ্য `omarvio-browser.apk`
            - Android 15 / 16 / 17 সমর্থিত (`targetSdk 35`)
            - জিরো প্রক্সি বাধা: Google, YouTube, Facebook, DuckDuckGo, Bing সহ সব সাইট ১০০% সরাসরি লোড হয়।
            - নেটিভ অ্যাড ও ট্র্যাকার ব্লকার + স্টেপ-বাই-স্টেপ হার্ডওয়্যার ব্যাক বাটন।
          files: |
            omarvio-browser.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
