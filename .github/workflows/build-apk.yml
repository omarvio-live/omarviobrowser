name: Build & Publish OmarVio Android Native APK

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional tag name if triggering a manual release build (e.g. v2.0.1)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release Native Chromium Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Resolve Release Version Metadata
        id: release_meta
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_NAME="${{ github.ref_name }}"
            IS_TAG="true"
            VERSION_NAME="${TAG_NAME#v}"
          elif [ -n "${{ github.event.inputs.release_tag }}" ]; then
            TAG_NAME="${{ github.event.inputs.release_tag }}"
            IS_TAG="true"
            VERSION_NAME="${TAG_NAME#v}"
          else
            TAG_NAME="v2.0.0-build.${{ github.run_number }}"
            IS_TAG="false"
            VERSION_NAME="2.0.0.${{ github.run_number }}"
          fi
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "is_tag_release=${IS_TAG}" >> "$GITHUB_OUTPUT"

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK 35 & Build Tools
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK_DIR" ]; then
            echo "Android SDK directory not found at $SDK_DIR"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          SDKMANAGER=$(find "$SDK_DIR/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1)
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER=$(command -v sdkmanager || true)
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found inside $SDK_DIR"
            exit 1
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_DIR" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_DIR" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Decode Release Keystore (if configured)
        run: |
          if [ -n "${{ secrets.OMARVIO_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.OMARVIO_KEYSTORE_BASE64 }}" | base64 -d > /tmp/omarvio-release.jks
            echo "OMARVIO_KEYSTORE_PATH=/tmp/omarvio-release.jks" >> "$GITHUB_ENV"
            echo "OMARVIO_KEYSTORE_PASSWORD=${{ secrets.OMARVIO_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "OMARVIO_KEY_ALIAS=${{ secrets.OMARVIO_KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "OMARVIO_KEY_PASSWORD=${{ secrets.OMARVIO_KEY_PASSWORD }}" >> "$GITHUB_ENV"
            echo "Release keystore configured cleanly."
          else
            echo "OMARVIO_KEYSTORE_BASE64 secret not set; falling back to default signing."
          fi

      - name: Build Android Release APK & Play Store AAB
        working-directory: android
        run: |
          gradle assembleRelease bundleRelease --no-daemon --stacktrace \
            -PversionName="${{ steps.release_meta.outputs.version_name }}" \
            -PversionCode="${{ steps.release_meta.outputs.version_code }}"

      - name: Prepare & Verify Signed APK and AAB Binaries
        run: |
          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"
          AAB_PATH="android/app/build/outputs/bundle/release/app-release.aab"
          if [ ! -f "$APK_PATH" ]; then
            echo "Release APK not found at $APK_PATH"
            ls -la android/app/build/outputs/apk/release/ || true
            exit 1
          fi
          if [ ! -f "$AAB_PATH" ]; then
            echo "Release AAB not found at $AAB_PATH"
            ls -la android/app/build/outputs/bundle/release/ || true
            exit 1
          fi
          cp "$APK_PATH" omarvio-browser.apk
          cp "$AAB_PATH" omarvio-browser.aab
          SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          APKSIGNER=$(find "$SDK_DIR/build-tools" -name apksigner -type f | head -n 1)
          if [ -z "$APKSIGNER" ]; then
            echo "apksigner not found in $SDK_DIR/build-tools"
            exit 1
          fi
          "$APKSIGNER" verify --verbose --print-certs omarvio-browser.apk

      - name: Upload APK & AAB Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: omarvio-browser-release-${{ steps.release_meta.outputs.version_name }}
          path: |
            omarvio-browser.apk
            omarvio-browser.aab
          if-no-files-found: error
          retention-days: 30

      - name: Publish Public GitHub Release APK & AAB
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag_name }}
          name: OMARVIO Browser Native Android APK (${{ steps.release_meta.outputs.version_name }})
          generate_release_notes: true
          make_latest: true
          body: |
            ### ওমারভিও নেটিভ অ্যান্ড্রয়েড ব্রাউজার (${{ steps.release_meta.outputs.version_name }})
            - সরাসরি ডাউনলোড ও ফোন ইনস্টলযোগ্য `omarvio-browser.apk` এবং Play Store `.aab` বান্ডল
            - Android 15 / 16 / 17 সমর্থিত (`targetSdk 35`)
            - জিরো প্রক্সি বাধা: Google, YouTube, Facebook, DuckDuckGo, Bing সহ সব সাইট ১০০% সরাসরি লোড হয়।
            - ডাইনামিক ৬-লিস্ট অ্যাড ব্লকার, অফলাইন `.mht` পেজ সেভ, বায়োমেট্রিক/পিন ভল্ট লক ও সরাসরি ইন-অ্যাপ আপডেট।
          files: |
            omarvio-browser.apk
            omarvio-browser.aab
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync Public APK Link File
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        env:
          REPO_SLUG: ${{ github.repository }}
          APP_VERSION: ${{ steps.release_meta.outputs.version_name }}
          APP_VERSION_CODE: ${{ steps.release_meta.outputs.version_code }}
        run: |
          node -e '
            const fs = require("fs");
            const repo = process.env.REPO_SLUG || "";
            const data = {
              repo,
              apkUrl: repo ? `https://github.com/${repo}/releases/latest/download/omarvio-browser.apk` : "",
              version: process.env.APP_VERSION || "2.0.0",
              versionCode: Number(process.env.APP_VERSION_CODE || 1),
              host: "github-releases",
              updatedAt: new Date().toISOString()
            };
            fs.writeFileSync("public/apk-release.json", JSON.stringify(data, null, 2) + "\n");
          '
          git config user.name "omarvio-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/apk-release.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update public APK release link [skip ci]"
            BRANCH_NAME="${GITHUB_REF#refs/heads/}"
            git pull --rebase origin "$BRANCH_NAME" || true
            git push origin "HEAD:$BRANCH_NAME" || echo "Manifest sync skipped cleanly"
          fi
